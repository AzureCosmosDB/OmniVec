name: BinSkim (.NET + Go + Rust binaries)

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'connectors/worker/dotnet/**'
      - 'connectors/ingestion/dotnet/**'
      - 'cli/**'
      - 'docgrok/**'
      - 'scripts/security/**'
      - '.github/workflows/binskim.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'connectors/worker/dotnet/**'
      - 'connectors/ingestion/dotnet/**'
      - 'cli/**'
      - 'docgrok/**'
      - 'scripts/security/**'
      - '.github/workflows/binskim.yml'

permissions:
  contents: read
  security-events: write

env:
  # Pin BinSkim like the actions above: an unpinned install picks up
  # package-layout changes (4.4.9.14 moved BinSkim.exe out of tools\net*\).
  BINSKIM_VERSION: 4.4.9.13

jobs:
  binskim-dotnet:
    name: BinSkim .NET worker
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Build worker
        run: dotnet publish connectors/worker/dotnet -c Release -o publish-out

      - name: Run BinSkim
        shell: pwsh
        run: |
          nuget install Microsoft.CodeAnalysis.BinSkim -Version $env:BINSKIM_VERSION -OutputDirectory $env:RUNNER_TEMP\bs -ExcludeVersion
          $bs = (Get-ChildItem "$env:RUNNER_TEMP\bs\Microsoft.CodeAnalysis.BinSkim\tools\net*\win-x64\BinSkim.exe" | Select-Object -First 1).FullName
          if (-not $bs) { throw "BinSkim.exe not found in Microsoft.CodeAnalysis.BinSkim $env:BINSKIM_VERSION" }
          & $bs analyze publish-out/OmniVec.Worker.dll --output binskim-dotnet.sarif --recurse false

      - name: Apply documented upstream-toolchain suppressions
        run: python scripts/security/filter_binskim_sarif.py binskim-dotnet.sarif binskim-dotnet-final.sarif

      - name: Upload BinSkim SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: binskim-dotnet-final.sarif
          category: binskim-dotnet

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: binskim-dotnet-sarif
          path: |
            binskim-dotnet.sarif
            binskim-dotnet-final.sarif

  binskim-go:
    name: BinSkim Go CLI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        working-directory: cli
        run: go build -trimpath -ldflags "-s -w" -o omnivec.exe .

      - name: Run BinSkim
        shell: pwsh
        run: |
          nuget install Microsoft.CodeAnalysis.BinSkim -Version $env:BINSKIM_VERSION -OutputDirectory $env:RUNNER_TEMP\bs -ExcludeVersion
          $bs = (Get-ChildItem "$env:RUNNER_TEMP\bs\Microsoft.CodeAnalysis.BinSkim\tools\net*\win-x64\BinSkim.exe" | Select-Object -First 1).FullName
          if (-not $bs) { throw "BinSkim.exe not found in Microsoft.CodeAnalysis.BinSkim $env:BINSKIM_VERSION" }
          & $bs analyze cli/omnivec.exe --output binskim-go.sarif --ignorePdbLoadError

      - name: Apply documented upstream-toolchain suppressions
        run: python scripts/security/filter_binskim_sarif.py binskim-go.sarif binskim-go-final.sarif

      - name: Upload BinSkim SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: binskim-go-final.sarif
          category: binskim-go

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: binskim-go-sarif
          path: |
            binskim-go.sarif
            binskim-go-final.sarif

  binskim-rust:
    name: BinSkim Rust router (docgrok-router)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout OmniVec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly + rust-src
        shell: pwsh
        run: |
          rustup toolchain install nightly --component rust-src
          rustup target add x86_64-pc-windows-msvc --toolchain nightly

      - name: Build hardened Rust router
        working-directory: docgrok/router
        run: cargo +nightly build --release --target x86_64-pc-windows-msvc

      - name: Run BinSkim
        shell: pwsh
        run: |
          nuget install Microsoft.CodeAnalysis.BinSkim -Version $env:BINSKIM_VERSION -OutputDirectory $env:RUNNER_TEMP\bs -ExcludeVersion
          $bs = (Get-ChildItem "$env:RUNNER_TEMP\bs\Microsoft.CodeAnalysis.BinSkim\tools\net*\win-x64\BinSkim.exe" | Select-Object -First 1).FullName
          if (-not $bs) { throw "BinSkim.exe not found in Microsoft.CodeAnalysis.BinSkim $env:BINSKIM_VERSION" }
          & $bs analyze docgrok/router/target/x86_64-pc-windows-msvc/release/docgrok-router.exe --output binskim-rust.sarif --recurse false

      - name: Apply documented upstream-toolchain suppressions
        run: python scripts/security/filter_binskim_sarif.py binskim-rust.sarif binskim-rust-final.sarif

      - name: Upload BinSkim SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: binskim-rust-final.sarif
          category: binskim-rust

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: binskim-rust-sarif
          path: |
            binskim-rust.sarif
            binskim-rust-final.sarif
