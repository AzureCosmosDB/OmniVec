name: build-pull-request-images

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: omnivec-api
            context: .
            dockerfile: Dockerfile
          - image: omnivec-web
            context: web
            dockerfile: web/Dockerfile
          - image: omnivec-changefeed
            context: .
            dockerfile: connectors/ingestion/dotnet/Dockerfile
          - image: omnivec-dotnet-worker
            context: connectors/worker/dotnet
            dockerfile: connectors/worker/dotnet/Dockerfile
          - image: omnivec-onelake-iceberg-watcher
            context: .
            dockerfile: connectors/ingestion/onelake_iceberg/Dockerfile
          - image: docgrok-router
            context: docgrok/router
            dockerfile: docgrok/router/Dockerfile
          - image: docgrok-mock-embedding
            context: docgrok/services/embedding/mock
            dockerfile: docgrok/services/embedding/mock/Dockerfile
          - image: omnivec-mock-source
            context: connectors/mock
            dockerfile: connectors/mock/Source/Dockerfile
          - image: omnivec-mock-destination
            context: connectors/mock
            dockerfile: connectors/mock/Destination/Dockerfile
    steps:
      - name: Checkout OmniVec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
