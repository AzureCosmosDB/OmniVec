name: python-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit / regression-trap suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/unit/requirements.txt
            mcp_servers/cosmos/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/unit/requirements.txt
          pip install -r mcp_servers/cosmos/requirements.txt

      - name: Install service requirements (best-effort)
        run: |
          for f in api/requirements.txt search/requirements.txt docgrok/requirements.txt; do
            if [ -f "$f" ]; then
              echo "::group::pip install -r $f"
              pip install -r "$f" || echo "::warning::optional install failed for $f"
              echo "::endgroup::"
            fi
          done

      - name: Run pytest
        run: |
          pytest tests/unit -v --tb=short --junitxml=junit-unit.xml

      - name: Upload junit XML on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-unit
          path: junit-unit.xml
          if-no-files-found: ignore

  portal-ui:
    name: Portal UI / CLI parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/ui/requirements.txt

      - name: Install UI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/ui/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run portal UI tests
        run: |
          pytest tests/ui -v --tb=short --junitxml=junit-ui.xml

      - name: Upload UI test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-ui
          path: junit-ui.xml
          if-no-files-found: ignore

  cli:
    name: CLI / portal contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run CLI tests
        working-directory: cli
        run: go test ./...

  mock-components:
    name: Isolated mock source / model / destination
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Rendered mock deployment contracts
        run: |
          pip install 'pytest>=8.0,<9.0' pyyaml hypothesis
          pytest tests/unit/test_mock_helm.py -q
      - name: Source and destination regressions
        run: dotnet run --project connectors/mock/Tests/OmniVec.Mock.Tests.csproj -c Release
      - name: Standalone Rust model regressions
        working-directory: docgrok/services/embedding/mock
        run: cargo test --locked
      - name: Rust router regressions
        working-directory: docgrok/router
        run: cargo test --locked
