{{- if and .Values.networkPolicy.enabled .Values.api.mockBenchmark.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnivec-mock-source-preview
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      omnivec-mock-component: source
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: omnivec-api
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnivec-mock-source-to-router
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [docgrok, docgrok-router]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              omnivec-mock-component: source
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnivec-mock-destination
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      omnivec-mock-component: destination
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              omnivec-mock-component: source
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnivec-mock-model
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: omnivec-mock-embedding
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [docgrok, docgrok-router]
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
