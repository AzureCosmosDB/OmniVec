{{- if and .Values.api.enabled .Values.api.mockBenchmark.enabled }}
{{- $root := . }}
{{- range $shard := until (int .Values.api.mockBenchmark.shardCount) }}
{{- $name := "omnivec-mock-sink" }}
{{- if gt $shard 0 }}{{- $name = printf "omnivec-mock-sink-%d" $shard }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.global.namespace }}
spec:
  # A single sink enforces one acceptance-rate budget per registered destination.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
      omnivec-mock-component: destination
  template:
    metadata:
      labels:
        app: {{ $name }}
        omnivec-mock-component: destination
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "omnivec.serviceAccountName" $root }}
      containers:
        - name: mock-sink
          image: {{ $root.Values.global.imageRegistry }}/{{ $root.Values.api.mockBenchmark.destinationImage.repository }}:{{ $root.Values.api.mockBenchmark.destinationImage.tag }}
          env:
            - name: OMNIVEC_MOCK_RECEIVER_SHARD
              value: {{ $shard | quote }}
            - name: OMNIVEC_MOCK_CONFIG_REFRESH_SECONDS
              value: {{ $root.Values.api.mockBenchmark.configRefreshSeconds | quote }}
            - name: OMNIVEC_CLOUD_DEPLOYMENTS_ENABLED
              value: "false"
            - name: COSMOS_ENDPOINT
              value: {{ $root.Values.azure.cosmos.endpoint | quote }}
            - name: COSMOS_DATABASE
              value: {{ $root.Values.azure.cosmos.database | quote }}
            - name: AZURE_CLIENT_ID
              value: {{ $root.Values.azure.workloadIdentity.clientId | quote }}
            - name: OMNIVEC_ADMIN_TOKEN
              value: {{ required "api.adminToken is required for mock component HTTP authentication" $root.Values.api.adminToken | quote }}
          resources:
            {{- toYaml $root.Values.api.mockBenchmark.sinkResources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
{{- end }}
